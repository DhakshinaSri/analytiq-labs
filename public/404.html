<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found | AnalytIQ Labs</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f9fd;color:#1f2d45;font:500 18px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px}
  h1{color:#10367d;font-size:clamp(2rem,5vw,3rem);margin:.2em 0}
  a{display:inline-block;margin-top:16px;padding:14px 26px;border-radius:10px;background:#10367d;color:#fff;font-weight:700;text-decoration:none}
  a:focus-visible{outline:3px solid #74b4da;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p style="color:#10367d;font-weight:700;letter-spacing:.08em">404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist.</p>
  <a id="home" href="/">Back to Home</a>
</main>
<script>
  // Works on user.github.io/, user.github.io/<repo>/ and custom domains.
  (function () {
    var seg = location.pathname.split('/')[1];
    var isGh = /\.github\.io$/.test(location.hostname);
    document.getElementById('home').href = isGh && seg ? '/' + seg + '/' : '/';
  })();
</script>
</body>
</html>
